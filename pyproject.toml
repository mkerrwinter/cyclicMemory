[tool.poetry]
name = "cyclic-memory"
version = "0.1.0"
description = "Experiments training fully connected networks on random vector datasets."
authors = []
readme = "README.md"
packages = [{ include = "cyclicMemory" }]

[tool.poetry.dependencies]
python = "^3.11"
torch = ">=2.0.0"
